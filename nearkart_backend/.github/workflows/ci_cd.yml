name: NearKart CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: nearkart-backend

jobs:
  # ── STEP 1: LINT + TYPE CHECK ────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: pip install flake8 black isort
      - name: Run flake8
        run: flake8 apps/ core/ config/
      - name: Run black check
        run: black --check apps/ core/ config/
      - name: Run isort check
        run: isort --check-only apps/ core/ config/

  # ── STEP 2: TESTS ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: nearkart_test
          POSTGRES_USER: nearkart
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev gdal-bin
      - name: Install Python deps
        run: pip install -r requirements/development.txt
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test-secret-key-for-ci
          DB_NAME: nearkart_test
          DB_USER: nearkart
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6379/1
          REDIS_CHANNEL_URL: redis://localhost:6379/2
          DEBUG: "True"
        run: pytest --cov=apps --cov-report=xml --cov-fail-under=75 -v

  # ── STEP 3: DOCKER BUILD ─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build --target production -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker tag $REGISTRY/$IMAGE_NAME:$IMAGE_TAG $REGISTRY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

  # ── STEP 4: DEPLOY TO STAGING (auto on develop) ──────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to ECS staging
        run: |
          aws ecs update-service \
            --cluster nearkart-staging \
            --service nearkart-backend-staging \
            --force-new-deployment \
            --region ap-south-1

  # ── STEP 5: DEPLOY TO PRODUCTION (manual approval on main)
  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production    # requires manual approval in GitHub
    steps:
      - name: Deploy to ECS production
        run: |
          aws ecs update-service \
            --cluster nearkart-production \
            --service nearkart-backend-production \
            --force-new-deployment \
            --region ap-south-1
