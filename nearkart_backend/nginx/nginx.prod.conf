# NearKart — Production Nginx Config
# SSL is terminated at the AWS Application Load Balancer.
# Nginx only handles HTTP (port 80) internally.
# ALB sets X-Forwarded-Proto: https — Django reads it via SECURE_PROXY_SSL_HEADER.

upstream django {
    server django:8000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=otp:10m     rate=1r/m;
limit_req_zone $binary_remote_addr zone=upload:10m  rate=5r/m;

# Connection limit (prevent single IP from exhausting connections)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name api.nearkart.in api-staging.nearkart.in;

    client_max_body_size 110M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ── SECURITY HEADERS ──────────────────────────────────
    add_header X-Content-Type-Options    nosniff;
    add_header X-Frame-Options           DENY;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           "strict-origin-when-cross-origin";

    # ── CONNECTION LIMIT ──────────────────────────────────
    limit_conn conn_limit 20;

    # ── REST API ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── OTP (1 request/min per IP) ────────────────────────
    location /api/v1/auth/otp/ {
        limit_req zone=otp burst=3 nodelay;
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
    }

    # ── VIDEO UPLOAD (rate limited) ───────────────────────
    location /api/v1/videos/request-upload/ {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        client_max_body_size 1M;
    }

    # ── WEBSOCKET ─────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # ── ADMIN ─────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
    }

    # ── STATIC FILES (served by nginx, not Django) ────────
    location /static/ {
        alias   /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ── HEALTH CHECK (no logging — reduces noise) ─────────
    location /api/v1/health/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ── BLOCK COMMON ATTACK PATHS ─────────────────────────
    location ~* \.(php|asp|aspx|jsp)$ {
        return 444;
    }

    # ── BLOCK SWAGGER IN PRODUCTION ──────────────────────
    # Swagger is available in staging (api-staging.nearkart.in) but not prod
    location /api/docs/ {
        return 403;
    }
    location /api/schema/ {
        return 403;
    }
}
