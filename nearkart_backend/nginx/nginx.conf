# ── Upstream pools with keepalive ─────────────────────────────────────────────
# keepalive 32: Nginx reuses up to 32 idle connections to Django per worker
# process instead of opening a new TCP connection per request. This halves
# connection setup overhead under high concurrency.
upstream django {
    server django:8000;
    keepalive 32;
}

upstream daphne {
    server daphne:8001;
    keepalive 16;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
# api:          600 req/min per IP (10 r/s) — covers normal browsing bursts
# otp:          1 r/m per IP at Nginx (Django also enforces 5/hour per phone)
# upload:       10 r/m per IP — video upload requests (presigned URL generation)
# photo_upload: 10 r/m per IP — product creation (photos stored via presigned URL)
#
# Note: Nginx limits are the outermost protection layer. Django UploadTracker
# (Redis Lua atomic counter) enforces the per-vendor daily cap independently.
# Two layers = Nginx blocks IP floods, Django blocks vendor abuse.
limit_req_zone  $binary_remote_addr zone=api:20m          rate=10r/s;
limit_req_zone  $binary_remote_addr zone=otp:10m          rate=1r/m;
limit_req_zone  $binary_remote_addr zone=upload:10m       rate=10r/m;
limit_req_zone  $binary_remote_addr zone=photo_upload:10m rate=10r/m;

# ── Simultaneous connection limit per IP ──────────────────────────────────────
# Prevents a single IP from holding hundreds of open connections.
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name localhost api.nearkart.in api-staging.nearkart.in;

    client_max_body_size 110M;

    # Max 200 simultaneous connections per IP
    limit_conn perip 200;

    # ── REST API ───────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass          http://django;
        proxy_http_version  1.1;
        proxy_set_header    Connection      "";          # keep-alive to upstream
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Tight timeouts — fail fast rather than queuing indefinitely.
        # Django itself has a 30 s Gunicorn timeout; set Nginx slightly higher
        # so Gunicorn can return a proper error rather than Nginx closing first.
        proxy_connect_timeout 10s;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;

        # Disable proxy buffering for streaming/SSE endpoints.
        proxy_buffering off;
    }

    # ── OTP — tighter rate limit ───────────────────────────────────────────────
    # This block is evaluated before /api/ because it is more specific.
    location /api/v1/auth/otp/ {
        limit_req zone=otp burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
    }

    # ── Video upload — presigned URL request ──────────────────────────────────
    # 10r/m per IP with burst=5: a vendor can request 5 URLs instantly then
    # gets 1 token per 6 seconds. Django UploadTracker enforces the daily cap.
    location /api/v1/videos/request-upload/ {
        limit_req zone=upload burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }

    # ── Product creation — photo upload gateway ────────────────────────────────
    # Exact match on POST /api/v1/products/ (product create with image metadata).
    # Photos upload directly to S3 via presigned URL — this endpoint saves metadata.
    # 10r/m per IP; Django UploadTracker enforces the per-vendor daily cap.
    location = /api/v1/products/ {
        limit_req zone=photo_upload burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }

    # ── Health check — no access log, no rate limit ────────────────────────────
    location /api/v1/health/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Admin ──────────────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }

    # ── API docs ───────────────────────────────────────────────────────────────
    location /api/docs/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
    }

    location /api/schema/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
    }

    # ── Static files — served directly by Nginx, zero Django involvement ───────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ── WebSocket ──────────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://daphne;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   4;
    gzip_min_length   1000;
    gzip_proxied      any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain;
}
