upstream django {
    server django:8000;
}

upstream daphne {
    server daphne:8001;
}

# Rate limiting zones (nginx supports r/s and r/m only, not r/h)
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=otp:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/m;

server {
    listen 80;
    server_name localhost api.nearkart.in api-staging.nearkart.in;

    client_max_body_size 110M;

    # ── REST API ───────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── OTP (stricter rate limit) ──────────────────────────
    location /api/v1/auth/otp/ {
        limit_req zone=otp burst=2 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── ADMIN ─────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API DOCS ──────────────────────────────────────────
    location /api/docs/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    location /api/schema/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    # ── STATIC FILES ──────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── WEBSOCKET ─────────────────────────────────────────
    location /ws/ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── HEALTH CHECK ──────────────────────────────────────
    location /api/v1/health/ {
        proxy_pass http://django;
        access_log off;
    }
}
