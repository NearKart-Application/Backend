name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, feature/**]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nearspot_test
          POSTGRES_USER: nearspot
          POSTGRES_PASSWORD: nearspot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DATABASE_URL: postgis://nearspot:nearspot@localhost:5432/nearspot_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      DB_PASSWORD: nearspot
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nearkart_backend/requirements/lock.txt

      - name: Install system dependencies (GDAL/PostGIS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev python3-dev

      - name: Install Python dependencies
        working-directory: nearkart_backend
        run: |
          pip install --upgrade pip
          pip install -r requirements/lock.txt
          pip install ruff

      - name: Create PostGIS template
        run: |
          PGPASSWORD=nearspot psql -h localhost -U nearspot -d nearspot_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run database migrations
        working-directory: nearkart_backend
        run: python manage.py migrate --run-syncdb

      - name: Check for missing migrations
        working-directory: nearkart_backend
        run: python manage.py migrate --check

      - name: Lint with ruff
        working-directory: nearkart_backend
        run: |
          ruff check . --select=E,F,W,C90,I --ignore=E501 \
            --exclude=migrations,__pycache__,venv,.venv

      - name: Run tests
        working-directory: nearkart_backend
        run: |
          pytest tests/ \
            --tb=short \
            -q \
            --no-header \
            -m "not integration and not geo and not slow"

      - name: Check Django deployment settings
        working-directory: nearkart_backend
        run: |
          python manage.py check --deploy 2>&1 | grep -v "WARNINGS:" || true
